<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOJ Finance Suite Tablet</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="hidden">
    <div class="tablet-shell">
      <header>
        <div>
          <h1>DOJ Finance Suite</h1>
          <p>Finanzamt-Backoffice Tablet</p>
        </div>
        <button id="closeBtn">Schließen</button>
      </header>

      <nav class="tabs">
        <button data-tab="dashboard" class="active">Dashboard</button>
        <button data-tab="private">Privatfälle</button>
        <button data-tab="business">Businessfälle</button>
        <button data-tab="transactions">Transaktionen</button>
        <button data-tab="reports">Reports</button>
        <button data-tab="mapping">Mapping</button>
      </nav>

      <main id="content"></main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
