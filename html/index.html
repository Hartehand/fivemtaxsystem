<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOJ Finance Suite Tablet</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="hidden">
    <div class="tablet-shell">
      <header>
        <div>
          <h1>DOJ Finance Suite</h1>
          <p>Finanzamt-Backoffice Tablet</p>
        </div>
        <button id="closeBtn">Schließen</button>
      </header>

      <nav class="tabs">
        <button data-tab="dashboard" class="active">Start</button>
        <button data-tab="private">Fälle Privat</button>
        <button data-tab="business">Fälle Business</button>
        <button data-tab="enforcement">Maßnahmen Mahnung</button>
        <button data-tab="installments">Maßnahmen Ratenpläne</button>
        <button data-tab="handoffs">Maßnahmen DOJ</button>
        <button data-tab="documents">Schriftgut</button>
        <button data-tab="reports">Schriftgut Reports</button>
        <button data-tab="citizens">Register Bürger</button>
        <button data-tab="companies">Register Firmen</button>
        <button data-tab="network">Register Netzwerk</button>
        <button data-tab="transactions">Register Transaktionen</button>
        <button data-tab="mapping">Verwaltung Mapping</button>
      </nav>

      <main id="content"></main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
